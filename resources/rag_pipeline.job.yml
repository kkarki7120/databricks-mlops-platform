resources:
  jobs:
    rag_pipeline:
      name: rag-support-assistant
      max_concurrent_runs: 1
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.py
            base_parameters:
              catalog: ${var.catalog}

        - task_key: ingest_evaluate_register
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ../notebooks/20_rag_pipeline.py
            base_parameters:
              catalog: ${var.catalog}
              embedding_endpoint: ${var.embedding_endpoint}
              llm_endpoint: ${var.llm_endpoint}
